# =============================================================================
# Source Definitions
# =============================================================================
# Declares the raw PostgreSQL tables as dbt sources.  Freshness checks
# on _ingestion_timestamp enable the freshness delay failure injection
# scenario (AI-8) and feed the quality validation layer (Phase 3).
# =============================================================================

version: 2

sources:
  - name: raw
    description: >
      Raw landing zone for extracted data. Records are loaded by the
      Phase 1 RawLoader with metadata columns (_ingestion_timestamp,
      _source_id, _batch_id).  Data is untransformed and may contain
      nulls, duplicates, or anomalies introduced by the failure
      injection framework.
    schema: raw
    tables:
      - name: raw_transactions
        description: >
          Synthetic e-commerce transaction records generated by the
          SyntheticDataGenerator (AI-1b).  Each row represents a
          single purchase event with customer, product, and payment
          details.
        loaded_at_field: _ingestion_timestamp
        freshness:
          warn_after:
            count: 24
            period: hour
          error_after:
            count: 48
            period: hour
        columns:
          - name: transaction_id
            description: "Unique transaction identifier (UUID)"
          - name: event_timestamp
            description: "Transaction creation time (UTC)"
          - name: customer_id
            description: "Customer account number (1000–99999)"
          - name: product_id
            description: "Product catalogue identifier (1–500)"
          - name: product_category
            description: "Product department: electronics, clothing, home, sports, books"
          - name: quantity
            description: "Units purchased (1–10)"
          - name: unit_price
            description: "Price per unit in GBP (lognormal distribution)"
          - name: total_amount
            description: "Line total: quantity × unit_price"
          - name: payment_method
            description: "Payment instrument: credit_card, debit_card, paypal, bank_transfer"
          - name: order_status
            description: "Order state: completed, pending, shipped, cancelled, refunded"
          - name: shipping_country
            description: "Shipping destination ISO code (nullable)"
          - name: customer_email
            description: "Customer contact email (nullable, synthetic)"
          - name: is_returning_customer
            description: "Whether customer has prior orders (boolean)"
          - name: _ingestion_timestamp
            description: "UTC timestamp when record was loaded into raw schema"
          - name: _source_id
            description: "Data source identifier (e.g. synthetic_v1)"
          - name: _batch_id
            description: "Unique batch identifier for the load run"
