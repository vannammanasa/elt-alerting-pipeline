# =============================================================================
# dbt Connection Profile
# =============================================================================
# Connects to the elt_warehouse database provisioned by Deliverable 1.
# Environment variables are set via Docker .env or shell exports.
# =============================================================================

elt_alerting_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'pipeline_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'pipeline_pass') }}"
      dbname: elt_warehouse
      schema: transformed
      threads: 4
      connect_timeout: 10
