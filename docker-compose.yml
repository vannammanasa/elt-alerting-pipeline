# =============================================================================
# docker-compose.yml — Full Environment for ELT Alerting Pipeline
# Project: An Empirical Evaluation of Severity-Based Alerting in ELT Pipelines
# Author:  Manasa Vannam (S2471596)
# =============================================================================
# Services:
#   1. postgres       — Primary data warehouse + observability database
#   2. airflow-init   — One-shot initialisation of Airflow metadata
#   3. airflow-web    — Airflow web UI (DAG management & monitoring)
#   4. airflow-sched  — Airflow scheduler (triggers DAG runs)
#   5. pipeline       — Core ELT application (extraction, loading, dbt, alerting)
# =============================================================================
# Alerting: Gmail SMTP with App Password (TLS on port 587)
# =============================================================================

version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@postgres:5432/airflow_metadata
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # ── Gmail SMTP for Airflow email alerts ──
    AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
    AIRFLOW__SMTP__SMTP_PORT: 587
    AIRFLOW__SMTP__SMTP_STARTTLS: 'true'
    AIRFLOW__SMTP__SMTP_SSL: 'false'
    AIRFLOW__SMTP__SMTP_USER: ${GMAIL_ADDRESS}
    AIRFLOW__SMTP__SMTP_PASSWORD: ${GMAIL_APP_PASSWORD}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${GMAIL_ADDRESS}
    # ── Pipeline-specific env vars available inside Airflow tasks ──
    PIPELINE_DB_HOST: postgres
    PIPELINE_DB_PORT: 5432
    PIPELINE_DB_NAME: elt_warehouse
    PIPELINE_DB_USER: pipeline_user
    PIPELINE_DB_PASSWORD: pipeline_pass
    OBSERVABILITY_DB_NAME: observability
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./dbt_project:/opt/airflow/dbt_project
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ===========================================================================
  # PostgreSQL — Data Warehouse + Observability Store + Airflow Metadata
  # ===========================================================================
  postgres:
    image: postgres:16-bookworm
    container_name: elt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ./config/init-schemas.sql:/docker-entrypoint-initdb.d/02-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elt_network

  # ===========================================================================
  # Airflow — Metadata Initialisation (one-shot)
  # ===========================================================================
  airflow-init:
    <<: *airflow-common
    container_name: elt_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@pipeline.local
    restart: "no"
    networks:
      - elt_network

  # ===========================================================================
  # Airflow — Web Server (DAG management UI)
  # ===========================================================================
  airflow-web:
    <<: *airflow-common
    container_name: elt_airflow_web
    restart: unless-stopped
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - elt_network

  # ===========================================================================
  # Airflow — Scheduler
  # ===========================================================================
  airflow-sched:
    <<: *airflow-common
    container_name: elt_airflow_scheduler
    restart: unless-stopped
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - elt_network

  # ===========================================================================
  # Pipeline — Core ELT Application Container
  # ===========================================================================
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elt_pipeline
    restart: "no"
    environment:
      # ── PostgreSQL Data Warehouse ──
      PIPELINE_DB_HOST: postgres
      PIPELINE_DB_PORT: 5432
      PIPELINE_DB_NAME: elt_warehouse
      PIPELINE_DB_USER: pipeline_user
      PIPELINE_DB_PASSWORD: pipeline_pass
      # ── PostgreSQL Observability ──
      OBSERVABILITY_DB_HOST: postgres
      OBSERVABILITY_DB_PORT: 5432
      OBSERVABILITY_DB_NAME: observability
      OBSERVABILITY_DB_USER: pipeline_user
      OBSERVABILITY_DB_PASSWORD: pipeline_pass
      # ── Gmail SMTP Alerting ──
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USE_TLS: "true"
      SMTP_USERNAME: ${GMAIL_ADDRESS}
      SMTP_PASSWORD: ${GMAIL_APP_PASSWORD}
      SMTP_SENDER: ${GMAIL_ADDRESS}
      SMTP_RECIPIENT: ${ALERT_RECIPIENT_EMAIL}
      # ── dbt ──
      DBT_PROFILES_DIR: /app/dbt_project
      DBT_PROJECT_DIR: /app/dbt_project
      # ── Experiment Config ──
      EXPERIMENT_MODE: "baseline"       # Options: baseline | smart
      LOG_LEVEL: INFO
    volumes:
      - ./src:/app/src
      - ./dbt_project:/app/dbt_project
      - ./config:/app/config
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./data:/app/data
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elt_network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  elt_network:
    driver: bridge
    name: elt_alerting_network
